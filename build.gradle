buildscript {
    ext {
        springBootVersion = '2.1.2.RELEASE'
        mapstructVersion = '1.3.1.Final'
    }
    repositories {
        // 将阿里云镜像放在最前面，提升下载速度并规避 TLS 问题
        maven { url 'https://maven.aliyun.com/nexus/content/groups/public/' }
        maven { url 'https://maven.aliyun.com/nexus/content/repositories/jcenter' }
        mavenCentral()
    }
    dependencies {
        classpath("org.springframework.boot:spring-boot-gradle-plugin:${springBootVersion}")
    }
}

apply plugin: 'java'
apply plugin: 'org.springframework.boot'
apply plugin: 'io.spring.dependency-management'

group = 'com.sncy'
version = '0.0.1-SNAPSHOT'
sourceCompatibility = '1.8'
ext {
    set('springBootAdminVersion', '2.1.1')
    set('springCloudVersion', 'Greenwich.RELEASE')
}
configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

// 统一所有模块的仓库配置
allprojects {
    repositories {
        // 阿里云镜像（国内加速，优先使用）
        maven { url 'https://maven.aliyun.com/nexus/content/groups/public/' }
        maven { url 'https://maven.aliyun.com/nexus/content/repositories/jcenter' }
        maven { url 'https://maven.aliyun.com/nexus/content/repositories/google' }
        // Spring 里程碑仓库
        maven { url 'https://repo.spring.io/milestone' }
        // Gradle 插件仓库
        maven { url 'https://plugins.gradle.org/m2/' }
        // 中央仓库作为最后备选
        mavenCentral()
    }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation group: 'mysql', name: 'mysql-connector-java', version: '5.1.49'

    implementation 'io.springfox:springfox-swagger2:2.9.2'
    implementation 'com.github.xiaoymin:knife4j-spring-ui:2.0.9'

    // JWT令牌
    implementation 'io.jsonwebtoken:jjwt:0.9.1'
    implementation 'javax.xml.bind:jaxb-api:2.3.1'

    // Apache POI - Excel导入导出
    implementation 'org.apache.poi:poi:4.1.2'
    implementation 'org.apache.poi:poi-ooxml:4.1.2'
}
allprojects {
    gradle.projectsEvaluated {
        tasks.withType(JavaCompile) {
            options.compilerArgs << "-Xlint:unchecked" << "-Xlint:deprecation"
        }
    }
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
    }
}
