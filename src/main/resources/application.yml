spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  redis:
    host: ${REDIS_HOST:127.0.0.1}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    database: ${REDIS_DATABASE:0}
    timeout: 2000ms
    lettuce:
      pool:
        max-active: 8
        max-idle: 8
        min-idle: 1
        max-wait: 2000ms

server:
  port: ${SERVER_PORT:9001}

app:
  cache:
    enabled: ${CACHE_ENABLED:false}
    local-cache: ${CACHE_LOCAL_ENABLED:false}
    key-prefix: ${CACHE_KEY_PREFIX:exam}
    default-ttl-seconds: ${CACHE_DEFAULT_TTL_SECONDS:600}
    null-ttl-seconds: ${CACHE_NULL_TTL_SECONDS:60}
    lock-wait-millis: ${CACHE_LOCK_WAIT_MILLIS:3000}
